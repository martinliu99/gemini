aop.launcher.diagnosticStrategy = simple
aop.launcher.diagnosticClasses = 

#aop.launcher.typeResolutionDetected = true

aop.launcher.byteCodeDumped = false

aop.logger.configLocation = META-INF/aop-logback.xml

aop.logger.allLogLevel = info
aop.logger.locationIncluded = false


aop.classScanner.acceptPackages = org.framework.aspect*
aop.classScanner.verboseEnabled = false

aop.globalTaskExecutor.parallel = true

aop.weaver.joinpointMatched = true
# aop.weaver.classLoaderExpressions = sun.reflect.DelegatingClassLoader || jdk.internal.reflect.DelegatingClassLoader

aop.weaver.redefinitionStrategy = RETRANSFORMATION


aop.factories.asmAutoComputed = false
